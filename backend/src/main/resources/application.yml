spring:
  application:
    name: bookprice

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=bookprice;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:bookprice_app}
    password: ${DB_PASSWORD:Bookprice!2026dev}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  # /admin 管理後台的 HTTP Basic 帳密（與前台會員完全無關）
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin1234}
      roles: ADMIN

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
